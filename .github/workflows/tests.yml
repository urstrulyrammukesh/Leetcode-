name: Run all solutions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run every file's own tests
        run: |
          fail=0
          for f in $(find . -name "*.py" -not -path "./.git/*" | sort); do
            python "$f" > /dev/null || { echo "FAILED: $f"; fail=1; }
          done
          exit $fail
